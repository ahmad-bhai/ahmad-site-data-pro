<!DOCTYPE html>
<html lang="en">
<body>
    
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live</title>
</head>
    
    <script>
// main.js
(function () {

    /* ====== LOCAL STORAGE MANAGEMENT ====== */
    const STORAGE_KEY = "quotex_pro_user_data";
    
    function loadSavedData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                return JSON.parse(saved);
            } catch (e) {
                return null;
            }
        }
        return null;
    }

    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    const cachedData = loadSavedData() || {
        user: "MAGIC SCRIPTS",
        id: "12345678",
        email: "magic.scripts@gmail.com",
        flag: "pk",
        s_profit: "0"
    };

    let regionNames = new Intl.DisplayNames(['en'], { type: 'region' });
    var dialogs = document.querySelectorAll("dialog");
    if (dialogs.length) {
        dialogs.forEach(dia => dia.remove());
    }
    var color = "#1c242a";
    var html = `<div style="font-family: sans-serif;padding:1rem;background:${color};width:${screen.width>500?(100+"%"):(screen.width-40)+"px"};border-top: 5px solid #05c55e" class="dia">
                <div style="text-align:center"><div style="line-height:50px;font-size:30px;color:#fff; font-weight:900">MAGIC SCRIPTS</div><svg version="1.0" xmlns="http://www.w3.org/2000/svg"
width="50pt" height="50pt" viewBox="0 0 180.000000 180.000000"
preserveAspectRatio="xMidYMid meet" style="display:inline-block;text-align:center">

<g transform="translate(0.000000,180.000000) scale(0.100000,-0.100000)"
fill="#fff" stroke="none">
<path d="M753 1622 l-133 -77 0 -67 0 -67 87 50 c49 28 96 55 105 60 17 9 18
-23 18 -626 l0 -636 -50 28 -50 28 0 443 0 442 -55 0 -55 0 0 -405 c0 -223 -3
-405 -7 -405 -5 0 -27 10 -50 22 l-43 23 0 308 0 308 -57 -3 -58 -3 -5 -267
-5 -267 -40 22 -40 23 0 339 0 339 103 59 102 59 0 64 c0 35 -3 64 -6 64 -4 0
-78 -41 -165 -92 l-159 -92 0 -401 0 -401 342 -198 c189 -110 348 -199 353
-199 6 0 164 89 353 199 l342 199 0 400 0 400 -159 93 c-87 50 -161 92 -165
92 -3 0 -6 -29 -6 -64 l0 -63 103 -60 102 -59 0 -339 0 -340 -42 -23 -43 -23
0 270 0 271 -60 0 -60 0 0 -307 0 -308 -40 -22 c-21 -13 -41 -23 -44 -23 -4 0
-6 182 -6 405 l0 405 -60 0 -60 0 0 -443 0 -442 -46 -28 c-26 -15 -48 -26 -50
-24 -2 2 -3 288 -2 635 l3 632 103 -60 c57 -33 105 -60 108 -60 2 0 4 29 4 65
l0 64 -92 54 c-51 30 -113 66 -138 80 l-45 26 -132 -77z"/>
</g>
</svg></div><br>
<div style="text-align:center">
    <label for="flag">FLAG</label>
    <span style="position: relative; display: inline-block; width: 180px; background:#fff;color:black;">
<span onclick="o.style.display=o.style.display=='inline-block'?'none':'inline-block'" class="s" id="s">
<img src="https://flagcdn.com/16x12/${cachedData.flag.toLowerCase()}.png">
${regionNames.of(cachedData.flag.toUpperCase())}
</span>
<div class="o" id="o">
  <div data-code="pk" data-name="Pakistan"><img src="https://flagcdn.com/16x12/pk.png"> Pakistan</div>
  <div data-code="in" data-name="India"><img src="https://flagcdn.com/16x12/in.png"> India</div>
  <div data-code="bd" data-name="Bangladesh"><img src="https://flagcdn.com/16x12/bd.png"> Bangladesh</div>
  <div data-code="sa" data-name="Saudi Arabia"><img src="https://flagcdn.com/16x12/sa.png"> Saudi Arabia</div>
  <div data-code="ae" data-name="United Arab Emirates"><img src="https://flagcdn.com/16x12/ae.png"> United Arab Emirates</div>
  <div data-code="tr" data-name="Turkey"><img src="https://flagcdn.com/16x12/tr.png"> Turkey</div>
  <div data-code="lk" data-name="Sri Lanka"><img src="https://flagcdn.com/16x12/lk.png"> Sri Lanka</div>
  <div data-code="au" data-name="Australia"><img src="https://flagcdn.com/16x12/au.png"> Australia</div>
  <div data-code="jp" data-name="Japan"><img src="https://flagcdn.com/16x12/jp.png"> Japan</div>
  <div data-code="np" data-name="Nepal"><img src="https://flagcdn.com/16x12/np.png"> Nepal</div>
  <div data-code="eg" data-name="Egypt"><img src="https://flagcdn.com/16x12/eg.png"> Egypt</div>
  <div data-code="my" data-name="Malaysia"><img src="https://flagcdn.com/16x12/my.png"> Malaysia</div>
  <div data-code="th" data-name="Thailand"><img src="https://flagcdn.com/16x12/th.png"> Thailand</div>
  <div data-code="kr" data-name="South Korea"><img src="https://flagcdn.com/16x12/kr.png"> South Korea</div>
  <div data-code="ng" data-name="Nigeria"><img src="https://flagcdn.com/16x12/ng.png"> Nigeria</div>
  <div data-code="mx" data-name="Mexico"><img src="https://flagcdn.com/16x12/mx.png"> Mexico</div>
</div>
</span>
    <br>
    <label for="user">USERNAME</label>
    <input id="user" type="text" placeholder="username" value="${cachedData.user}" /><br>
    <label for="id">ID</label>
    <input id="id" type="text" placeholder="userid" value="${cachedData.id}" /><br>
    <label for="email">EMAIL</label>
    <input id="email" type="text" placeholder="email" value="${cachedData.email}" /><br>
    <label for="s_profit">START PROFIT</label>
    <input id="s_profit" type="number" placeholder="Start Profit" value="${cachedData.s_profit}" /><br><br>
</div>
    <div style="text-align: center; display: flex; justify-content: center; gap: 10px;">
        <button id="saveBtn" style="padding:10px 15px;background:#3498db;color:#fff;border:none;box-shadow:none;cursor:pointer">SAVE DATA</button>
        <button id="runBtn" style="padding:10px 20px;background:#05c55e;color:#fff;border:none;box-shadow:none;cursor:pointer">RUN CODE</button>
    
    <div id="user_id_display" style="text-align:center; font-size:12px; font-weight:700; color:#fff; margin-top:10px;">
    Your ID: <span id="dynamic_id_val" style="color:#fff;">Loading...</span>
</div>
    </div><br>
    <div style="color:#05c55e;font-size:12px;text-align:center">🪄 ENJOY THE PRO VERSION 🪄</div>
    <hr style="border-color:#fff">
    <div style="text-align:center;font-weight:100;color:#fff">Made with <span style="cursor: pointer;color: #fff;-webkit-animation-name: heartbeat;animation-name: heartbeat;-webkit-animation-duration: 1.42857s;animation-duration: 1.42857s;-webkit-animation-iteration-count: infinite;animation-iteration-count: infinite;-webkit-animation-timing-function: ease;animation-timing-function: ease;">♥</span> by <a style="color:#fff" href="https://t.me/Magic_Scripts">@Magic_Scripts</a></div>
</div>`;

    var myDialog = document.createElement("dialog");
    document.body.appendChild(myDialog);
    myDialog.innerHTML = html;
    
    var flag = cachedData.flag;
    myDialog.querySelectorAll(".o div").forEach(el => {
        el.addEventListener("click", () => {
            const code = el.getAttribute("data-code");
            const name = el.getAttribute("data-name");
            s.innerHTML = `<img src="https://flagcdn.com/16x12/${code}.png">${name}`;
            o.style.display = 'none';
            flag = code;
            window.selectedFlag = code;
        });
    });
// URL se ?id=... parameter read karne ki logic
var urlParams = new URLSearchParams(window.location.search);
var currentId = urlParams.get('id') || "";

// UI mein ID inject karne ki logic
var idSpan = myDialog.querySelector("#dynamic_id_val");
if (idSpan) {
    idSpan.innerText = currentId;
}
    document.onclick = e => !e.target.closest('#s') && o.style.display != 'none' && (o.style.display = 'none');
    
    var styleElem = document.head.appendChild(document.createElement("style"));
    styleElem.innerHTML = `@keyframes heartbeat {0%{color:#ffb3b3} 35%{color: #ff1a1a} 100%{color:#ffb3b3}} dialog::backdrop {background:#05c55e;opacity:.25} ::selection {background:white;color:${color}} 
    .s {cursor: pointer;display: flex;align-items: center;padding: 5px;width: 180px;position: relative;}.o {display: none;position: absolute;top: 100%;left: 0;width: 180px;overflow-y: scroll;height: 200px;background: #fff;box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); z-index: 1000;}.o div {padding: 5px;display: flex;align-items: center;cursor: pointer;background: #fff;}.o div:hover {background: #eee;}img {margin-right: 5px;}`;
    
    myDialog.showModal();

    var labels = document.querySelectorAll(".dia label");
    labels.forEach(l => {
        l.style = `display:inline-block;width:100px;font-weight:600;color:#fff;font-size:12px`;
    });

    var inputs = document.querySelectorAll(".dia input");
    inputs.forEach(i => {
        i.style = `display:inline-block;width:180px;padding:5px;margin-top:2px;outline:none;border-radius:0`;
    });

    // SAVE DATA BUTTON EVENT
    myDialog.querySelector("#saveBtn").addEventListener("click", () => {
        const dataToSave = {
            user: document.querySelector("#user").value,
            id: document.querySelector("#id").value,
            email: document.querySelector("#email").value,
            flag: window.selectedFlag || flag || "pk",
            s_profit: document.querySelector("#s_profit").value
        };
        saveData(dataToSave);
        console.log("Data Saved Successfully!");
    });

    // RUN BUTTON LOGIC
    myDialog.querySelector("#runBtn").addEventListener("click", () => {
        var user = document.querySelector("#user").value;
        var id = document.querySelector("#id").value;
        var email = document.querySelector("#email").value.toLowerCase();
        var selected_flag = window.selectedFlag || flag || "pk";
        var s_profit = Number(document.querySelector("#s_profit").value) || 0;
        var inr__rate = 90;

        // Auto save on run too
        saveData({
            user: user,
            id: id,
            email: email,
            flag: selected_flag,
            s_profit: s_profit
        });

        myDialog.close();

        // Remove Dialogs & Backdrops
        document.querySelectorAll("dialog").forEach(d => d.remove());
        const backdrop = document.getElementById("dialog-backdrop");
        if (backdrop) backdrop.remove();

        const loader = document.getElementById("__my_loader__");
        if (loader) loader.remove();

        // Banner Cleanup
        const banner = document.querySelector("main div[dir]");
        if (banner) banner.remove();

 // DOM Target for Usermenu
var live_el = document.querySelector("#header-mobile-asset-btn + * > :first-child > :first-child");
if (live_el) {
var statusText = live_el.querySelector(":nth-child(3) > :first-child");
if (statusText) {
    // Device check logic
    if (/Mobi|Android|iPhone|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        statusText.innerHTML = "live";
    } else {
        statusText.innerHTML = "live account";
    }
    statusText.style.color = "#0faf59";
    }
}

        history.pushState({}, null, "/en/trade");
        document.title = "Live trading | Quotex";

        var carret = live_el ? live_el.childNodes[1] : null;
        var state__carret = true;
        var i_profit;

        // Leaderboard Position Logic
        const LEADER__POS = (sum) => {
            var leader_el = document.querySelector(".app__sidepanel > :last-child > :nth-child(2) > :first-child");
            if (!leader_el) return;
            var pos__el = leader_el.childNodes[3]?.childNodes[1];
            if (!pos__el) return;

            var pos;
            var my__orig__pos = 80000;

            if (sum > 0) {
                pos = Math.floor(my__orig__pos / sum);
            } else if (sum < 0) {
                pos = my__orig__pos - Math.floor(Math.random() * 100 + 1);
            } else {
                pos = Math.floor(my__orig__pos);
            }

            if (pos < 21) pos += 20;

            if (sum != 0 && pos > 100) {
                pos__el.nodeValue = `100+`;
            } else if (sum == 0) {
                pos__el.nodeValue = `-`;
            } else {
                pos__el.nodeValue = `${Math.abs(pos)}`;
            }
        };

        // Leaderboard Placement Logic
        const LEADER__PLACE = (sum) => {
            (function exists() {
                const leaders = document.querySelectorAll(".M_p_O > :last-child > div");
                if (!leaders.length) return setTimeout(exists, 100);

                Array.from(leaders).some((l) => {
                    const leader_profit = l.childNodes[2];
                    if (!leader_profit) return false;
                    const leader_profit_simplify = parseFloat(leader_profit.innerHTML.replace(/\$|\,/g, ""));

                    if (leader_profit_simplify <= sum) {
                        const leader__flag = l.querySelector(`:nth-child(2) > :nth-child(2) > svg > use`);
                        if (leader__flag) {
                            leader__flag.setAttribute("href", `/profile/images/flags.svg#flag-${selected_flag.toLowerCase()}`);
                        }
                        const leader_name = l.querySelector(`:nth-child(3)`);
                        if (leader_name) leader_name.innerHTML = user;

                        if (sum >= 30000) {
                            leader_profit.innerHTML = `$30,000.00+`;
                        } else {
                            leader_profit.innerHTML = `$${sum.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                        }

                        const realPosEl = l.querySelector(`:nth-child(2) > :first-child > div`);
                        if (realPosEl) {
                            const REAL_POS = realPosEl.innerHTML;
                            const mainPosFooter = document.querySelector(".app__sidepanel > :last-child > :nth-child(2) > :first-child");
                            if (mainPosFooter && mainPosFooter.childNodes[3]?.childNodes[1]) {
                                mainPosFooter.childNodes[3].childNodes[1].nodeValue = REAL_POS;
                            }
                        }
                        return true;
                    }
                    return false;
                });
            })();
        };

        // Calculate Trades and Update Leaderboard
        const TradesCalc = () => {
            if (i_profit === undefined) {
                i_profit = s_profit;
            }
            var leader_container = document.querySelector(".app__sidepanel");
            if (!leader_container) return;
            var leader_el = leader_container.lastChild?.childNodes[1]?.firstChild;
            if (!leader_el) return;

            var pl_text = leader_el.childNodes[1]?.lastChild;
            if (pl_text) {
                if (i_profit >= 0) {
                    pl_text.innerHTML = "$" + i_profit.toLocaleString("en", { useGrouping: true, minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    pl_text.style.color = "#0faf59";
                } else {
                    pl_text.innerHTML = Math.abs(i_profit).toLocaleString("en", { useGrouping: true, minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "$";
                    pl_text.style.color = "#db4635";
                }
            }

            var barLine = leader_el.childNodes[2]?.querySelector("span");
            if (barLine) {
                barLine.style.width = i_profit <= 0 ? "1%" : "100%";
            }

            LEADER__POS(i_profit);
            LEADER__PLACE(i_profit);
        };

        window.onclick = function () {
            (function waitForSpriteFlag() {
                const el = document.querySelector(".M_p_O > :nth-child(2) > :first-child > :nth-child(2) > :first-child");
                if (!el) return setTimeout(waitForSpriteFlag, 100);

                const useEl = el.querySelector("svg use");
                if (!useEl) return setTimeout(waitForSpriteFlag, 100);

                useEl.setAttribute("href", `/profile/images/flags.svg#flag-${selected_flag}`);

                const nameUser = el.querySelector("p");
                if (nameUser) nameUser.textContent = `${user}`;

                TradesCalc();
            })();
        };

        // Profile Balance Icon Update Logic
        var limit__lower, limit__upper;
        const BALANCE__ICON = () => {
            if (!live_el) return;
            var balanceNode = live_el.querySelector(":nth-child(3) > :last-child");
            if (!balanceNode) return;

            var balance__str = balanceNode.innerText;
            var balance = parseFloat(balance__str.replace(/,|\$|\₹/g, ''));
            var currency = balance__str[0];

            if (currency === "$") {
                limit__lower = 5000;
                limit__upper = 10000;
            } else if (currency === "₹") {
                limit__lower = 415000;
                limit__upper = 830000;
            }

            var icon_el = live_el.querySelector(":nth-child(1) svg use");
            if (!icon_el) return;

            if (balance >= limit__lower && balance < limit__upper) {
                icon_el.setAttribute("xlink:href", "/profile/images/spritemap.svg#icon-profile-level-pro");
            } else if (balance >= limit__upper) {
                icon_el.setAttribute("xlink:href", "/profile/images/spritemap.svg#icon-profile-level-vip");
            } else {
                icon_el.setAttribute("xlink:href", "/profile/images/spritemap.svg#icon-profile-level-standart");
            }
        };

        // Dropdown Profile Details Update Logic
        const DROPDOWN__MAIN = () => {
            var drop_el = document.querySelector("#header-mobile-asset-btn + * > :first-child > :last-child > :first-child");
            if (!drop_el) return;

            var emailNode = drop_el.querySelector(":first-child > :nth-child(2) > :first-child > :first-child > :nth-child(2) > :first-child > :first-child");
            if (emailNode) emailNode.innerText = email;

            var idNode = drop_el.querySelector(":first-child > :nth-child(2) > :first-child > :first-child > :nth-child(2) > :first-child > :last-child");
            if (idNode) idNode.innerText = `ID: ${id}`;

            const main__icon = live_el.querySelector(":nth-child(1) svg use")?.getAttribute("xlink:href");
            if (main__icon) {
                var levelIcon = drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :first-child svg use");
                if (levelIcon) levelIcon.setAttribute("xlink:href", main__icon);

                // Clean string extract karein (e.g. "standart", "pro", "vip")
                var levelKey = main__icon.split("-").pop().toLowerCase();

                var levelNameEl = drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :first-child > :nth-child(2) > :first-child");
                if (levelNameEl) {
                    levelNameEl.innerText = levelKey === "standart" ? "standart:" : `${levelKey}:`;
                }

                var percentage__profit = drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :first-child > :nth-child(2) > :last-child");
                
                if (percentage__profit) {
                    // Direct levelKey string variable se exact match karein
                    if (levelKey === "standart") {
                        percentage__profit.innerText = "+0% profit";
                    }
                    else if (levelKey === "pro") {
                        percentage__profit.innerText = "+2% profit";
                    }
                    else if (levelKey === "vip") {
                        percentage__profit.innerText = "+4% profit";
                    }
                }
            }
        };



        const DROPDOWN = () => {
            DROPDOWN__MAIN();

            var drop_switching = document.querySelector("#header-mobile-asset-btn + * > :first-child > :nth-child(2) > :first-child > :last-child");
            if (!drop_switching) return;

            var live__el = drop_switching.firstChild;
            var demo__el = drop_switching.lastChild;
            if (!live__el || !demo__el) return;

            var pencil__el = demo__el.childNodes[2];

            if (live__el.querySelector("a")) live__el.querySelector("a").innerText = "Demo Account";
            if (demo__el.querySelector("a")) demo__el.querySelector("a").innerText = "Live Account";

            if (live__el.querySelector("b")) live__el.querySelector("b").remove();
            if (live__el.querySelector("div")) live__el.querySelector("div").remove();
            if (live__el.querySelector("button")) live__el.querySelector("button").remove();

            if (demo__el.childNodes[1] && demo__el.childNodes[1].lastChild) {
                demo__el.childNodes[1].lastChild.remove();
            }

            demo__el.insertAdjacentHTML("beforeend", `<div class="KZUc1">The daily limit is not set</div><button class="s3gwg">set limit</button>`);
            if (pencil__el) live__el.append(pencil__el);
            demo__el.parentNode.insertBefore(demo__el, live__el);

            live__el.insertAdjacentHTML("beforeend", `<div class="WjlOy"><b class="YnoT0">$10,000.00</b><div class="VIanI"><svg class="icon-refresh"><use xlink:href="/profile/images/spritemap.svg#icon-refresh"></use></svg></div></div>`);
        };

        if (carret) {
            carret.onclick = function () {
                auto_open_dropdown();
            };
        }
        
        function auto_open_dropdown() {
            if (state__carret) {
                (function exists() {
                    var el = document.querySelector("#header-mobile-asset-btn + * > :first-child > :last-child > :first-child > :first-child > :nth-child(2) > :first-child > :first-child");
                    if (!el) return setTimeout(exists, 100);
                    DROPDOWN();
                })();
            }
            state__carret = !state__carret;
        }

        BALANCE__ICON();

        // Balance Observer for Live Profit Calculation
        var start_balance__str = live_el ? live_el.querySelector(":nth-child(3) > :last-child")?.innerText || "0" : "0";
        var start_balance = parseFloat(start_balance__str.replace(/,|\$|\₹/g, '')) || 0;

        var observer = new MutationObserver(() => {
            var end_balance__str = live_el.querySelector(":nth-child(3) > :last-child")?.innerText || "0";
            var end_balance = parseFloat(end_balance__str.replace(/,|\$|\₹/g, '')) || 0;
            i_profit = end_balance - start_balance + s_profit;
            BALANCE__ICON();
        });

        var target__el = document.querySelector("#header-mobile-asset-btn + * > :first-child > :first-child > :nth-child(3) > :last-child");
        if (target__el) {
            observer.observe(target__el, {
                subtree: true,
                characterData: true
            });
        }
    });

})();
</script>

</body>
